# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# ---------------------------------------------------------------
# CodeRabbit AI Configuration
# ---------------------------------------------------------------

# 기본 응답 언어
language: "ko-KR"

# 리뷰 톤 및 응답 방식
tone_instructions: >
  1. 리뷰는 핵심만 간결하게 작성하세요.
  2. 문제를 발견한 경우 원인과 해결 방법을 명확히 제시하세요.
  3. 설명은 실무자가 바로 이해하고 수정할 수 있을 정도로 구체적으로 작성하세요.
  4. 불필요한 개념 설명, 장황한 배경 설명, 동일 내용 반복은 생략하세요.
  5. 단순 스타일 취향보다는 실제 버그, 유지보수성, 안정성, 보안, 성능 문제를 우선적으로 지적하세요.
  6. 수정이 반드시 필요한 문제와 선택적으로 개선 가능한 사항을 구분해서 설명하세요.
  7. 코드 변경을 제안할 때는 가능한 경우 구체적인 수정 방향을 함께 제시하세요.
  8. 이미 코드에서 정상적으로 처리되고 있는 내용을 불필요하게 다시 지적하지 마세요.
  9. 칭찬은 필요한 경우에만 짧고 위트 있게 작성하세요.
  10. 리뷰 코멘트는 한국어로 작성하되, 클래스명, 메서드명, 변수명, API명 등 코드 식별자는 원문을 유지하세요.

# ---------------------------------------------------------------
# Pull Request Review
# ---------------------------------------------------------------

reviews:
  # 리뷰 스타일
  # chill: 과도하게 엄격하지 않으면서 실질적인 문제 중심으로 리뷰
  profile: "chill"

  # CodeRabbit 코멘트 resolve + 최신 리뷰 완료 + pre-merge 조건 충족 시
  # 승인 워크플로우 사용
  request_changes_workflow: true

  # PR 전체 변경 사항 요약
  high_level_summary: true

  # Walkthrough 영역 기본 접기
  collapse_walkthrough: true

  # 변경된 파일별 요약 제공
  changed_files_summary: true

  # 코드 흐름 시퀀스 다이어그램 비활성화
  # 불필요한 출력 및 리뷰 시간 절약
  sequence_diagrams: false

  # 연결된 Issue 내용을 리뷰 컨텍스트로 활용
  assess_linked_issues: true

  # 관련 Issue 표시
  related_issues: true

  # 관련 PR 자동 탐색 비활성화
  related_prs: false

  # Label 추천 비활성화
  suggested_labels: false

  # Label 자동 적용 비활성화
  auto_apply_labels: false

  # Reviewer 추천 비활성화
  suggested_reviewers: false

  # Reviewer 자동 할당 비활성화
  auto_assign_reviewers: false

  # PR 요약의 poem 기능 비활성화
  poem: false

  # AI Agent가 바로 활용할 수 있는 수정 프롬프트 제공
  enable_prompt_for_ai_agents: true

  # -------------------------------------------------------------
  # Automatic Review
  # -------------------------------------------------------------

  auto_review:
    # PR 생성/변경 시 자동 리뷰
    enabled: true

    # 새로운 커밋이 추가되면
    # 전체 PR을 다시 보는 대신 변경된 부분 중심으로 incremental review
    auto_incremental_review: true

# ---------------------------------------------------------------
# Chat
# ---------------------------------------------------------------

chat:
  # CodeRabbit을 직접 멘션하지 않아도 관련 대화에 자동 응답
  auto_reply: true

# ---------------------------------------------------------------
# Knowledge Base
# ---------------------------------------------------------------

knowledge_base:
  # 필요한 경우 외부 최신 문서를 검색하여 리뷰에 활용
  web_search:
    enabled: true

  # Repository의 코드 가이드라인을 Knowledge Base로 활용
  code_guidelines:
    enabled: true
