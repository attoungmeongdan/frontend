# ---------------------------------------------------------------
# CodeRabbit AI 설정
# ---------------------------------------------------------------

# 응답 기본 언어 설정
language: "ko-KR"

# AI 페르소나 및 톤앤매너 지시
tone_instructions: >
  1. 리뷰는 핵심만 간결하게 작성하세요.
  2. 문제의 원인과 해결 방법을 명확히 제시하되, 이해하기 쉬운 말로 설명해서 실무에 바로 도움이 되게 하세요.
  3. 불필요한 개념 설명이나 장황한 부연은 생략하세요.
  4. 칭찬은 짧고 위트 있게 하세요.

# ---------------------------------------------------------------
# 코드 리뷰 기능 세부 설정
# ---------------------------------------------------------------
reviews:
  profile: "chill" # 리뷰 전반 스타일 (스타일 지적 포함, 균형 잡힌 톤)
  request_changes_workflow: true # 코드래빗 코멘트 resolve + 최신 커밋 리뷰 완료 + 프리머지 체크 통과 시 자동 Approve
  high_level_summary: true # PR 변경 사항 고수준 요약 활성화
  collapse_walkthrough: true # 워크스루 코멘트 접기 활성화
  changed_files_summary: true # 변경된 파일별 요약 생성
  sequence_diagrams: false # 실행 흐름 시퀀스 다이어그램 생성 비활성화 (속도 우선)
  assess_linked_issues: true # 연결된 이슈 분석 컨텍스트 활용
  related_issues: true # 연관 다른 이슈 링크 활성화
  related_prs: false # 연관 다른 PR 링크 비활성화
  suggested_labels: false # 적절한 레이블 제안 비활성화
  auto_apply_labels: false # 제안 레이블 자동 적용 비활성화
  suggested_reviewers: false # 동료 리뷰어 추천 비활성화
  auto_assign_reviewers: false # 추천 리뷰어 자동 할당 비활성화
  poem: false # 리뷰 요약에 위트 있는 시 비활성화
  enable_prompt_for_ai_agents: true # 리뷰 코멘트에 "AI 에이전트용 프롬프트" 섹션 포함

# ---------------------------------------------------------------
# 자동 리뷰 트리거 설정
# ---------------------------------------------------------------
auto_review:
  enabled: true
  auto_incremental_review: true # 추가 커밋 시 변경된 부분만 자동 리뷰

# ---------------------------------------------------------------
# 채팅 기능 설정
# ---------------------------------------------------------------
chat:
  auto_reply: true # 태그하지 않아도 자동 답글 활성화

# ---------------------------------------------------------------
# CodeRabbit의 지식 기반(Knowledge Base) 설정
# ---------------------------------------------------------------
knowledge_base:
  web_search:
    enabled: true # 최신 문서 검색 허용
  code_guidelines:
    enabled: true
