# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# ---------------------------------------------------------------
# CodeRabbit AI Configuration
# ---------------------------------------------------------------

# 기본 응답 언어
language: "ko-KR"

# 리뷰 톤 및 응답 방식
tone_instructions: >
  핵심만 간결히
  문제 발견 시 원인 해결책과 구체적 수정 방향을 제시해 실무자가 바로 수정 가능한 수준으로 불필요한 개념 배경 설명 반복은 생략
  스타일보다 버그 유지보수성 안정성 보안 성능을 우선 지적하고 필수 수정 사항과 선택 개선 사항을 구분
  이미 잘 처리된 부분은 재지적 금지
  칭찬은 필요시 짧고 위트있게 코드 식별자(클래스 메서드 변수 API명)는 원문 유지 나머지는 한국어로 작성

# ---------------------------------------------------------------
# Pull Request Review
# ---------------------------------------------------------------

reviews:
  # 리뷰 스타일
  # chill: 과도하게 엄격하지 않으면서 실질적인 문제 중심으로 리뷰
  profile: "chill"

  # CodeRabbit 코멘트 resolve + 최신 리뷰 완료 + pre-merge 조건 충족 시
  # 승인 워크플로우 사용
  request_changes_workflow: true

  # PR 전체 변경 사항 요약
  high_level_summary: true

  # Walkthrough 영역 기본 접기
  collapse_walkthrough: true

  # 변경된 파일별 요약 제공
  changed_files_summary: true

  # 코드 흐름 시퀀스 다이어그램 비활성화
  # 불필요한 출력 및 리뷰 시간 절약
  sequence_diagrams: false

  # 연결된 Issue 내용을 리뷰 컨텍스트로 활용
  assess_linked_issues: true

  # 관련 Issue 표시
  related_issues: true

  # 관련 PR 자동 탐색 비활성화
  related_prs: false

  # Label 추천 비활성화
  suggested_labels: false

  # Label 자동 적용 비활성화
  auto_apply_labels: false

  # Reviewer 추천 비활성화
  suggested_reviewers: false

  # Reviewer 자동 할당 비활성화
  auto_assign_reviewers: false

  # PR 요약의 poem 기능 비활성화
  poem: false

  # AI Agent가 바로 활용할 수 있는 수정 프롬프트 제공
  enable_prompt_for_ai_agents: true

  # -------------------------------------------------------------
  # Automatic Review
  # -------------------------------------------------------------

  auto_review:
    # PR 생성/변경 시 자동 리뷰
    enabled: true

    # 새로운 커밋이 추가되면
    # 전체 PR을 다시 보는 대신 변경된 부분 중심으로 incremental review
    auto_incremental_review: true

# ---------------------------------------------------------------
# Chat
# ---------------------------------------------------------------

chat:
  # CodeRabbit을 직접 멘션하지 않아도 관련 대화에 자동 응답
  auto_reply: true

# ---------------------------------------------------------------
# Knowledge Base
# ---------------------------------------------------------------

knowledge_base:
  # 필요한 경우 외부 최신 문서를 검색하여 리뷰에 활용
  web_search:
    enabled: true

  # Repository의 코드 가이드라인을 Knowledge Base로 활용
  code_guidelines:
    enabled: true
